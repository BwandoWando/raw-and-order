[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "my-agent"
version = "0.1.0"
description = "Agent that reads camera raw files, extracts EXIF and annotates them with an LLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "pillow>=10.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyexiftool>=0.5",
    "rawpy>=0.21",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=0.2"]
openai = ["langchain-openai>=0.2"]
anthropic = ["langchain-anthropic>=0.3"]
heic = ["pillow-heif>=0.16"]
ui = ["streamlit>=1.40"]
all = ["my-agent[ollama,openai,anthropic,heic,ui]"]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
my-agent = "my_agent.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/my_agent"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle (PEP 8)
    "F",        # pyflakes
    "I",        # isort (import order)
    "N",        # pep8-naming
    "D",        # pydocstyle (PEP 257)
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "BLE",      # no blind `except Exception`
    "TRY",      # tryceratops (exception-handling hygiene)
    "RUF",
]
ignore = [
    "D105",    # magic methods need no docstring
    "D107",    # __init__ args are documented on the class
    "TRY003",  # allow messages on raise
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"migrations/**" = ["D"]
"src/my_agent/ui/**" = ["RUF001"]  # × and – are deliberate typography in UI text
"tests/**/test_ui*.py" = ["D", "RUF001"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["rawpy.*", "rawpy", "exiftool.*", "exiftool", "pandas", "pandas.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
