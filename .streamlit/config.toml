# Used when running `streamlit run src/my_agent/ui/app.py` from the project root.
# `raw-and-order ui` passes the same settings on the command line.

[server]
# Only this computer can open the UI (Streamlit's default listens on all
# network interfaces, which would expose your photos and GPS locations).
address = "localhost"

[client]
# Show the top-right menu (System / Light / Dark theme switch) but hide
# developer items such as "Deploy": this app is for local use only.
toolbarMode = "viewer"

[browser]
# Streamlit sends usage statistics unless this is off.
gatherUsageStats = false

[theme]
# Light and dark themes plus page padding (`raw-and-order ui` passes the same file).
# The path is relative to the folder `streamlit run` is started from.
base = "src/my_agent/ui/theme.toml"
